name: Deploy Staging

on:
  push:
    branches:
      - stage

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            REPO="web-zenly"
            DIR="/home/zunkireelabs/devprojects/websiteprojects/${REPO}-web-stage"

            if [ ! -d "$DIR" ]; then
              git clone https://github.com/Zunkireelabs/web-zenly.git "$DIR"
            fi

            cd "$DIR"
            git fetch origin
            git checkout stage
            git pull origin stage

            docker compose -f docker-compose.dev.yml up -d --build

            echo "Waiting for container to be healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect web-zenly-web-stage --format='{{.State.Health.Status}}' 2>/dev/null)
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy."
                break
              fi
              echo "Attempt $i/12 — status: $STATUS"
              sleep 10
            done

      - name: Verify HTTP response
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            for i in $(seq 1 6); do
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.STAGING_DOMAIN }})
              if [ "$RESPONSE" = "200" ]; then
                echo "Staging is live and returning 200."
                exit 0
              fi
              echo "Attempt $i/6 — got $RESPONSE, retrying in 15s..."
              sleep 15
            done
            echo "ERROR: Staging did not return 200 after retries."
            exit 1
