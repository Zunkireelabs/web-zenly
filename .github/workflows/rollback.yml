name: Rollback

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA to roll back to"
        required: true
      environment:
        description: "Environment to roll back"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      reason:
        description: "Reason for rollback (optional)"
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Rollback on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            REPO="web-zenly"
            ENV="${{ github.event.inputs.environment }}"

            if [ "$ENV" = "production" ]; then
              DIR="/home/zunkireelabs/devprojects/websiteprojects/${REPO}-web-prod"
              CONTAINER="web-zenly-web-prod"
              COMPOSE="docker-compose.yml"
            else
              DIR="/home/zunkireelabs/devprojects/websiteprojects/${REPO}-web-stage"
              CONTAINER="web-zenly-web-stage"
              COMPOSE="docker-compose.dev.yml"
            fi

            cd "$DIR"
            git fetch origin
            git checkout ${{ github.event.inputs.commit_sha }}

            docker compose -f $COMPOSE up -d --build

            echo "Waiting for container to be healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect $CONTAINER --format='{{.State.Health.Status}}' 2>/dev/null)
              if [ "$STATUS" = "healthy" ]; then
                echo "Rollback successful. Container is healthy."
                break
              fi
              echo "Attempt $i/12 — status: $STATUS"
              sleep 10
            done
