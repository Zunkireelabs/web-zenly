services:
  app:
    container_name: web-zenly-web-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EDGEX_API_KEY: ${EDGEX_API_KEY:-}
    environment:
      OTP_UPSTREAM: http://web-zenly-otp-prod:3000
    depends_on:
      - otp
    networks:
      - hosting
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "traefik.http.routers.web-zenly-web-prod.rule=Host(`zennly.io`) || Host(`www.zennly.io`)"
      - "traefik.http.routers.web-zenly-web-prod.entrypoints=websecure"
      - "traefik.http.routers.web-zenly-web-prod.tls=true"
      - "traefik.http.routers.web-zenly-web-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-zenly-web-prod.middlewares=web-zenly-web-prod-wwwredirect"
      - "traefik.http.routers.web-zenly-web-prod-http.rule=Host(`zennly.io`) || Host(`www.zennly.io`)"
      - "traefik.http.routers.web-zenly-web-prod-http.entrypoints=web"
      - "traefik.http.routers.web-zenly-web-prod-http.middlewares=web-zenly-web-prod-wwwredirect,web-zenly-web-prod-redirect"
      - "traefik.http.middlewares.web-zenly-web-prod-redirect.redirectscheme.scheme=https"
      # Canonical host is the apex (zennly.io): 301 www -> apex, keeping path and query. Apex requests don't match the regex and pass through.
      - "traefik.http.middlewares.web-zenly-web-prod-wwwredirect.redirectregex.regex=^https?://www\\.zennly\\.io/(.*)"
      - "traefik.http.middlewares.web-zenly-web-prod-wwwredirect.redirectregex.replacement=https://zennly.io/$${1}"
      - "traefik.http.middlewares.web-zenly-web-prod-wwwredirect.redirectregex.permanent=true"
      # Legacy host: 301 zenly.zunkireelabs.com -> zennly.io (path kept). High priority so it wins over any older rule for this host.
      - "traefik.http.routers.web-zenly-web-legacy.rule=Host(`zenly.zunkireelabs.com`)"
      - "traefik.http.routers.web-zenly-web-legacy.priority=1000"
      - "traefik.http.routers.web-zenly-web-legacy.entrypoints=websecure"
      - "traefik.http.routers.web-zenly-web-legacy.tls=true"
      - "traefik.http.routers.web-zenly-web-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-zenly-web-legacy.middlewares=web-zenly-web-legacy-redirect"
      - "traefik.http.routers.web-zenly-web-legacy.service=noop@internal"
      - "traefik.http.routers.web-zenly-web-legacy-http.rule=Host(`zenly.zunkireelabs.com`)"
      - "traefik.http.routers.web-zenly-web-legacy-http.priority=1000"
      - "traefik.http.routers.web-zenly-web-legacy-http.entrypoints=web"
      - "traefik.http.routers.web-zenly-web-legacy-http.middlewares=web-zenly-web-legacy-redirect"
      - "traefik.http.routers.web-zenly-web-legacy-http.service=noop@internal"
      - "traefik.http.middlewares.web-zenly-web-legacy-redirect.redirectregex.regex=^https?://zenly\\.zunkireelabs\\.com/?(.*)"
      - "traefik.http.middlewares.web-zenly-web-legacy-redirect.redirectregex.replacement=https://zennly.io/$${1}"
      - "traefik.http.middlewares.web-zenly-web-legacy-redirect.redirectregex.permanent=true"
      - "traefik.http.services.web-zenly-web-prod.loadbalancer.server.port=80"
  otp:
    container_name: web-zenly-otp-prod
    build:
      context: ./otp-service
    environment:
      NODE_ENV: production
      OTP_SECRET: ${OTP_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OTP_FROM: ${OTP_FROM:-Zennly <info@zennly.io>}
      SITE_URL: https://zennly.io
      DEMO_LOGIN_EMAIL: ${DEMO_LOGIN_EMAIL:-demo.customer@zunkireelabs.com}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:-ZenlyDemo2026!}
      DEMO_LOGIN_URL: ${DEMO_LOGIN_URL:-https://dev-zenly.zunkireelabs.com/nuad-thai-spa/login}
    networks:
      - hosting
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  hosting:
    external: true
